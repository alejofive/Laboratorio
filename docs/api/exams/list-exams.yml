info:
  name: List Exams
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/exams"

runtime:
  scripts:
    - type: after-response
      code: |-
        const grouped = res.body ?? {};
        const exams = Object.values(grouped)
          .flat()
          .filter((exam) => exam && typeof exam.id === "string");

        bru.setVar("examId1", exams[0]?.id ?? "");
        bru.setVar("examId2", exams[1]?.id ?? "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

