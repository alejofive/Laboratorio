info:
  name: List Patients
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/patients?page=1&limit=10&search="
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: search
      value: ""
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        const firstPatient = res.body?.data?.[0];
        const patientId = firstPatient?.id ?? firstPatient?._id ?? "";
        bru.setVar("patientId", patientId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
